<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respuestas - Cumple de Manu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #0A3254;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #0A3254;
            color: white;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .btn-refresh {
            display: block;
            width: 150px;
            margin: 0 auto 20px auto;
            padding: 10px;
            background-color: #E23636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-refresh:hover {
            background-color: #B30000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Respuestas de los Invitados</h1>
        <button class="btn-refresh" onclick="fetchResponses()">Actualizar Datos</button>
        
        <table id="responses-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Nombre</th>
                    <th>Género</th>
                    <th>Asiste</th>
                    <th>Actividades</th>
                    <th>Canciones</th>
                    <th>Comida</th>
                </tr>
            </thead>
            <tbody id="responses-body">
                <!-- Data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchResponses() {
            try {
                // ¡IMPORTANTE! Reemplaza esto con tus datos de JSONBin.io
                const JSONBIN_API_KEY = '$2a$10$PRijnUhvQCRr8IE0ZgGEaeh.p0TE/aU5RD1Chvy2IKzxr6Dp.B7aS';
                const JSONBIN_BIN_ID = '6a294ef2da38895dfea62c18';

                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                
                const json = await response.json();
                const data = json.record || [];
                
                const tbody = document.getElementById('responses-body');
                tbody.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay respuestas todavía.</td></tr>';
                    return;
                }

                data.reverse().forEach(item => {
                    const tr = document.createElement('tr');
                    
                    const date = new Date(item.timestamp).toLocaleString();
                    const attending = item.attending ? '✅ Sí' : '❌ No';
                    const songs = item.songs ? item.songs.join(', ') : '';

                    tr.innerHTML = `
                        <td>${date}</td>
                        <td><strong>${item.name || '-'}</strong></td>
                        <td>${item.gender || '-'}</td>
                        <td>${attending}</td>
                        <td>${item.activities || '-'}</td>
                        <td>${songs || '-'}</td>
                        <td>${item.food || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching responses:', error);
                alert('No se pudieron cargar las respuestas.');
            }
        }

        // Cargar al iniciar
        fetchResponses();
    </script>
</body>
</html>
